<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write test</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26264A;--cream:#FFF7E8;--green:#2F9E44;--red:#C92A2A}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:18px;line-height:1.35}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1,h2{font-family:'Fredoka',sans-serif;font-weight:600;margin:0 0 8px}
h1{font-size:28px}h2{font-size:22px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;margin:0 0 16px}
.note{font-size:15px;color:#4A4A6A;font-weight:700}
.target{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:600;line-height:1.2}
button.b{min-height:52px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:800 18px 'Nunito',sans-serif;padding:0 18px;cursor:pointer;color:var(--ink)}
.go{background:var(--green) !important;border-color:var(--green) !important;color:#fff !important;font-family:'Fredoka',sans-serif !important;font-size:24px !important;font-weight:600 !important}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cmp{font-size:24px;font-weight:800;margin:6px 0;word-wrap:break-word}
.cmp small{display:block;font-size:14px;color:#4A4A6A;font-weight:800}
.bad{background:#FFE3E3;color:var(--red);border-radius:6px;padding:0 4px}
.good{color:#2B8A3E}
ul.fix{margin:6px 0 0;padding-left:22px}
ul.fix li{font-size:20px;font-weight:800;margin:6px 0}
.ok{font-family:'Fredoka',sans-serif;font-size:28px;color:#2B8A3E}
pre.dbg{white-space:pre-wrap;font-size:13px;background:#EFE8D6;border-radius:10px;padding:8px;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<div class="wrap">
<h1>Write test</h1>
<p class="note">For Ms Tan. Nothing is saved.</p>
<div class="card">
 <p class="note">Copy this sentence.</p>
 <div class="target" id="target"></div>
 <div id="pad"></div>
 <div class="row"><button class="b go" id="check">Check</button><button class="b" id="next">Next sentence</button></div>
 <div id="result" aria-live="polite"></div>
 <pre class="dbg" id="dbg" hidden></pre>
</div>
</div>
<script src="data.js"></script>
<script src="check.js"></script>
<script src="recognize.js"></script>
<script src="writepad.js"></script>
<script>
const DEBUG = /[?&]debug/.test(location.search);
const S = [
 'The cat is on the desk.','The spider is in the pencil case.','The ball is under the bag.','The frog is on the book.',
 'The ruler is in the notebook.','The lizard is under the car.','The doll is on the go-kart.','The rat is in the desk.',
 'The plane is under the desk.','The duck is on the bike.','I have got a cheese sandwich.','I haven’t got a steak.',
 'Is it a pen?','The tiger hides in the tall grass.'
];
let i = 0, pad = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LEX = new Set();
(window.CONTENT ? window.CONTENT.units : []).forEach(u => { u.items.forEach(it => String(it.en).toLowerCase().split(/\s+/).forEach(w => LEX.add(w.replace(/[^a-z']/g, '')))); u.sentences.forEach(s => s.en.toLowerCase().split(/\s+/).forEach(w => LEX.add(w.replace(/[^a-z']/g, '')))); });
S.forEach(s => s.toLowerCase().replace(/’/g, "'").split(/\s+/).forEach(w => LEX.add(w.replace(/[^a-z']/g, ''))));
function debug(r, n, W, H) {
  if (!DEBUG) return; $('dbg').hidden = false;
  $('dbg').textContent = 'read: "' + r.text + '"  (xh ' + Math.round(r.xh) + ', base ' + Math.round(r.base) + ', pad ' + Math.round(W) + 'x' + Math.round(H) + ', strokes ' + n + ')\n' +
    r.chars.map(c => c.ch === ' ' ? '[space]' : c.ch + ' ' + Math.round(c.conf * 100) + '% (' + c.alt.map(a => a[0] + ' ' + Math.round(a[1] * 100)).join(', ') + ') h=' + (c.box ? Math.round(c.box.h) : '-')).join('\n');
}
function show() { $('target').textContent = S[i]; $('result').innerHTML = ''; if (pad) pad.destroy(); pad = WritePad.mount($('pad'), { lexicon: LEX, debug }); }
$('next').onclick = () => { i = (i + 1) % S.length; show(); };
$('check').onclick = () => {
  pad.flush();
  const exp = S[i].replace('’', "'"), act = pad.getText().replace(/’/g, "'");
  const r = checkAnswer(exp, act);
  const my = r.my.map(w => w.bad ? '<span class="bad">' + esc(w.text) + '</span>' : esc(w.text)).join(' ');
  let h = '<div class="cmp"><small>Teacher’s answer</small><span class="good">' + esc(S[i]) + '</span></div>' +
          '<div class="cmp"><small>My answer</small>' + (my || '<i>(empty)</i>') + '</div>';
  if (r.ok) h += '<div class="ok">Perfect! Big letter, spaces and full stop are all correct.</div>';
  else h += '<h2 style="margin-top:10px">What should I correct?</h2><ul class="fix">' + r.issues.map(x => '<li>' + esc(x.say) + '</li>').join('') + '</ul>';
  $('result').innerHTML = h;
};
show();
</script>
</body>
</html>
