<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write test</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26264A;--cream:#FFF7E8;--blue:#3B5BDB;--green:#2F9E44;--red:#C92A2A}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:18px;line-height:1.35}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1,h2{font-family:'Fredoka',sans-serif;font-weight:600;margin:0 0 8px}
h1{font-size:28px}h2{font-size:22px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;margin:0 0 16px}
.note{font-size:15px;color:#4A4A6A;font-weight:700}
.target{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:600;line-height:1.2}
label{display:block;font-weight:800;margin:12px 0 6px}
.answer{position:relative;min-height:120px;border:3px solid var(--ink);border-radius:14px;background:#fff repeating-linear-gradient(transparent,transparent 53px,#CDE7FF 53px,#CDE7FF 55px);display:flex;align-items:center;justify-content:flex-start;padding:4px 10px}
.answer textarea{width:100%;height:110px;border:0;outline:0;background:transparent;font-family:'Nunito',sans-serif;font-size:30px;font-weight:700;resize:none;color:var(--ink)}
.answer canvas{display:none;max-width:100%;height:110px}
.answer.hasink textarea{display:none}
.answer.hasink canvas{display:block}
button{min-height:52px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:800 18px 'Nunito',sans-serif;padding:0 20px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
button.on{background:#FFD43B}
.go{background:var(--green);border-color:var(--green);color:#fff;font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cmp{font-size:24px;font-weight:800;margin:6px 0;word-wrap:break-word}
.cmp small{display:block;font-size:14px;color:#4A4A6A;font-weight:800}
.cmp img{max-width:100%;height:80px;display:block}
.bad{background:#FFE3E3;color:var(--red);border-radius:6px;padding:0 4px}
.good{color:#2B8A3E}
ul.fix{margin:6px 0 0;padding-left:22px}
ul.fix li{font-size:20px;font-weight:800;margin:6px 0}
.ok{font-family:'Fredoka',sans-serif;font-size:28px;color:#2B8A3E}
code{background:#EFE8D6;padding:2px 6px;border-radius:6px;font-size:16px;word-break:break-all}
#pad{width:100%;height:240px;border:3px solid var(--ink);border-radius:14px;touch-action:none;display:block;background:#fff repeating-linear-gradient(#fff,#fff 58px,#CDE7FF 58px,#CDE7FF 60px)}
#pad.erase{cursor:cell}
</style>
</head>
<body>
<div class="wrap">
<h1>Write test</h1>
<p class="note">For Ms Tan. Nothing is saved.</p>

<div class="card">
 <p class="note">Copy this sentence.</p>
 <div class="target" id="target"></div>

 <label for="ans">Write here.</label>
 <div class="answer" id="answer">
  <textarea id="ans" lang="en" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="Your answer. Type here, or write on the pad below."></textarea>
  <canvas id="inkView" aria-label="What you wrote on the pad"></canvas>
 </div>

 <label>Write on the pad with your finger.</label>
 <canvas id="pad" aria-label="Writing pad"></canvas>

 <div class="row">
  <button class="go" id="check">Check</button>
  <button id="next">Next sentence</button>
  <button id="rubber" aria-pressed="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#26264A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M7 21h12"/><path d="M5.5 14.5 14 6a2.1 2.1 0 0 1 3 0l2 2a2.1 2.1 0 0 1 0 3L11 19.5H8L5.5 17a1.8 1.8 0 0 1 0-2.5z"/></svg>Rubber</button>
  <button id="clear">Clear</button>
 </div>

 <div id="result" aria-live="polite"></div>
 <p class="note" style="margin-top:12px">What the keyboard sent (spaces shown as &middot;):<br><code id="raw">(nothing yet)</code></p>
</div>
</div>

<script src="check.js"></script>
<script>
const S = [
 'The cat is on the desk.','The spider is in the pencil case.','The ball is under the bag.','The frog is on the book.',
 'The ruler is in the notebook.','The lizard is under the car.','The doll is on the go-kart.','The rat is in the desk.',
 'The plane is under the desk.','The duck is on the bike.','I have got a cheese sandwich.','I haven’t got a steak.',
 'Is it a pen?','The tiger hides in the tall grass.'
];
let i = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rawView(v) { return v.length ? v.split('').map(c => c === ' ' ? '·' : c === '\n' ? '↵' : c).join('') : '(empty)'; }

/* ---------- writing pad (finger, stylus or mouse) ---------- */
const pad = $('pad'), px = pad.getContext('2d'), view = $('inkView'), vx = view.getContext('2d');
let erasing = false, down = false, hasInk = false;
function fit() {
  const snap = hasInk ? pad.toDataURL() : null;
  const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  pad.width = Math.round(r.width * d); pad.height = Math.round(r.height * d);
  px.setTransform(d, 0, 0, d, 0, 0); px.lineCap = 'round'; px.lineJoin = 'round';
  if (snap) { const im = new Image(); im.onload = () => { px.save(); px.setTransform(1, 0, 0, 1, 0, 0); px.drawImage(im, 0, 0, pad.width, pad.height); px.restore(); }; im.src = snap; }
}
fit(); window.addEventListener('resize', fit);
function style() {
  if (erasing) { px.globalCompositeOperation = 'destination-out'; px.lineWidth = 30; }
  else { px.globalCompositeOperation = 'source-over'; px.lineWidth = 7; px.strokeStyle = '#26264A'; }
}
const pt = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
pad.addEventListener('pointerdown', e => { down = true; pad.setPointerCapture(e.pointerId); style(); const [x, y] = pt(e); px.beginPath(); px.moveTo(x, y); px.lineTo(x + .1, y + .1); px.stroke(); });
pad.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pt(e); px.lineTo(x, y); px.stroke(); });
['pointerup', 'pointercancel'].forEach(t => pad.addEventListener(t, () => { if (!down) return; down = false; px.beginPath(); inkToAnswer(); }));

// find the ink, then show it (cropped and scaled) in the answer space
function inkBox() {
  const w = pad.width, h = pad.height, a = px.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) { if (a[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 4, h: y1 - y0 + 4 };
}
function inkToAnswer() {
  const b = inkBox(); hasInk = !!b;
  $('answer').classList.toggle('hasink', hasInk);
  if (!b) { vx.clearRect(0, 0, view.width, view.height); return; }
  const H = 110, d = window.devicePixelRatio || 1, maxW = $('answer').clientWidth - 30;
  const s = Math.min(H / b.h, maxW / b.w, 1.2 * (1 / d) * d);
  view.style.height = Math.round(b.h * s / d * d) + 'px';
  view.width = Math.round(b.w * s); view.height = Math.round(b.h * s);
  view.style.width = view.width + 'px'; view.style.height = view.height + 'px';
  vx.clearRect(0, 0, view.width, view.height);
  vx.drawImage(pad, b.x, b.y, b.w, b.h, 0, 0, view.width, view.height);
}
function clearAll() {
  px.save(); px.setTransform(1, 0, 0, 1, 0, 0); px.clearRect(0, 0, pad.width, pad.height); px.restore();
  hasInk = false; $('answer').classList.remove('hasink'); $('ans').value = ''; $('result').innerHTML = ''; $('raw').textContent = '(nothing yet)';
}

/* ---------- buttons ---------- */
$('rubber').onclick = () => { erasing = !erasing; $('rubber').classList.toggle('on', erasing); $('rubber').setAttribute('aria-pressed', erasing); pad.classList.toggle('erase', erasing); };
$('clear').onclick = clearAll;
function show() { $('target').textContent = S[i]; clearAll(); }
$('next').onclick = () => { i = (i + 1) % S.length; show(); };
$('ans').addEventListener('input', e => { $('raw').textContent = rawView(e.target.value); });
$('check').onclick = () => {
  const typed = $('ans').value;
  if (hasInk && !typed.trim()) {
    $('result').innerHTML = '<div class="cmp"><small>Teacher’s answer</small><span class="good">' + esc(S[i]) + '</span></div>' +
      '<div class="cmp"><small>My writing</small><img alt="My writing" src="' + view.toDataURL() + '"></div>' +
      '<p class="note">Your writing is shown here. The app cannot read pad writing by itself yet. Type the sentence in the box to try the automatic checking.</p>';
    return;
  }
  const exp = S[i].replace('’', "'"), act = typed.replace(/’/g, "'");
  const r = checkAnswer(exp, act);
  const my = r.my.map(w => w.bad ? '<span class="bad">' + esc(w.text) + '</span>' : esc(w.text)).join(' ');
  let h = '<div class="cmp"><small>Teacher’s answer</small><span class="good">' + esc(S[i]) + '</span></div>' +
          '<div class="cmp"><small>My answer</small>' + (my || '<i>(empty)</i>') + '</div>';
  if (r.ok) h += '<div class="ok">Perfect! Big letter, spaces and full stop are all correct.</div>';
  else h += '<h2 style="margin-top:10px">What should I correct?</h2><ul class="fix">' + r.issues.map(x => '<li>' + esc(x.say) + '</li>').join('') + '</ul>';
  $('result').innerHTML = h;
};
show();
</script>
</body>
</html>
