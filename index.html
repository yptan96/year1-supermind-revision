<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 1 English Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26264A;--cream:#FFF7E8;--blue:#3B5BDB;--blue-d:#1F3A9C;--green:#2F9E44;--green-d:#1E6B2E;--muted:#4A4A6A;--yellow:#FFD43B;--red:#C92A2A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:18px;line-height:1.35}
button,input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0}
.hidden{display:none !important}

/* ---------- login (edu-game-login-page) ---------- */
.login-container{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:32px;max-width:480px;width:100%;box-shadow:0 8px 0 var(--ink);animation:slideIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-logo{width:72px;height:72px;border-radius:20px;background:var(--blue);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.login-title{font-family:'Fredoka',sans-serif;font-size:34px;font-weight:600;text-align:center;margin:0 0 4px;line-height:1.15}
.login-subtitle{font-size:19px;color:var(--muted);text-align:center;margin:0 0 22px;font-weight:700}
.credential-line{font-size:14px;color:var(--muted);text-align:center;margin:0 0 14px}
.resume-banner{background:#FFF3BF;border-radius:16px;padding:16px;text-align:center;margin:0 0 20px}
.resume-text{font-weight:800;margin:0 0 12px}
.resume-fresh-btn{display:block;width:100%;background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline;cursor:pointer;margin-top:10px;min-height:44px;font-weight:700}
.form-group{margin-bottom:18px}
.form-label{display:block;font-weight:800;margin-bottom:6px}
.form-input{width:100%;min-height:56px;padding:0 16px;font-size:20px;font-weight:700;border:3px solid var(--ink);border-radius:14px;background:#fff}
.form-input:focus{outline:4px solid #A5B4FC}
.login-btn{width:100%;min-height:60px;background:var(--green);color:#fff;border:0;border-radius:18px;font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;cursor:pointer;box-shadow:0 5px 0 var(--green-d);margin-top:6px}
.login-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.login-btn:disabled{background:#9ca3af;box-shadow:none}

/* ---------- header ---------- */
.app-container{max-width:1040px;margin:0 auto;padding:14px 16px 40px}
.welcome-message{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;margin-bottom:16px}
.welcome-top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 16px}
.welcome-text{grid-column:2;justify-self:center;text-align:center;font-weight:800;font-size:19px;margin:0}
.welcome-top-row .logout-btn{grid-column:3;justify-self:end}
.welcome-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.logout-btn,.header-btn{min-height:44px;border-radius:999px;padding:0 20px;font-weight:800;font-size:16px;cursor:pointer;border:2px solid var(--ink);background:#fff}
.header-btn{background:var(--ink);color:#fff}
.header-btn.on{background:var(--blue);border-color:var(--blue)}
.brandbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.brandbar .logo{width:40px;height:40px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.brandbar h1{font-size:24px}

/* ---------- generic ---------- */
.btn{min-height:52px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:18px;padding:0 22px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 5px 0 var(--green-d);font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;min-height:64px;padding:0 40px}
.btn-green:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.btn-pill{border-radius:999px}
.btn-sm{min-height:44px;font-size:16px;padding:0 16px}
.btn-danger{border-color:var(--red);color:var(--red)}
.label{font-weight:800;color:var(--muted);font-size:16px;margin:0 0 8px}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px 20px}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;background:#FFF3BF;margin:3px 4px 3px 0}

/* ---------- home ---------- */
.home h2{font-size:30px;margin:6px 0 14px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.unit-btn{min-height:92px;border-radius:16px;border:4px solid transparent;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800}
.unit-btn.on{border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.unit-btn .u1{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600}
.unit-btn .u3{font-size:13px;font-weight:700;color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.skill-btn{min-height:56px;border-radius:999px;padding:0 22px;font-weight:800;font-size:18px;background:#fff;border:3px solid var(--ink);cursor:pointer}
.skill-btn.on{background:var(--blue);color:#fff;border-color:var(--ink)}
.levels{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.level-btn{min-height:66px;border-radius:16px;padding:6px 20px;text-align:left;background:#fff;border:3px solid var(--ink);cursor:pointer;font-weight:800}
.level-btn.on{background:var(--yellow)}
.level-btn small{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.home-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:10px}
.summary{font-weight:700;color:var(--muted);font-size:15px;margin-top:10px}

/* ---------- game ---------- */
.gbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.gtag{font-weight:800;font-size:15px;border-radius:999px;padding:6px 14px}
.progress{flex:1;min-width:120px;height:14px;border-radius:999px;background:#E9E2D0;overflow:hidden}
.progress>div{height:100%;background:var(--green);transition:width .3s}
.gcount{font-weight:800}
.prompt{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.prompt h2{font-size:28px}
.prompt .sub{font-weight:800;color:var(--muted);font-size:15px}
.spk{width:72px;height:72px;min-width:72px;border-radius:50%;border:0;background:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 var(--blue-d)}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.spk svg{width:36px;height:36px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:150px;background:#fff;border:4px solid var(--ink);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer;font-weight:800;font-size:24px}
.opt img{max-width:100%;max-height:120px;object-fit:contain}
.opt.word{min-height:80px;font-family:'Fredoka',sans-serif;font-size:30px;font-weight:600}
.opt.letter{min-height:96px;font-family:'Fredoka',sans-serif;font-size:56px;font-weight:600}
.opt.correct{background:#D3F9D8;border-color:#2B8A3E}
.opt.wrong{background:#FFE3E3;border-color:var(--red);animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.numtile{font-family:'Fredoka',sans-serif;font-size:72px;font-weight:600;color:var(--blue);line-height:1}
.bigpic{background:#fff;border:3px solid var(--ink);border-radius:22px;min-height:190px;display:flex;align-items:center;justify-content:center;padding:12px}
.bigpic img{max-height:170px;max-width:100%;object-fit:contain}
.bigpic .numtile{font-size:110px}
.bigtext{font-family:'Fredoka',sans-serif;font-size:44px;font-weight:600;line-height:1.15;text-align:center}
.msg{min-height:32px;font-weight:800;font-size:20px;margin:10px 0}
.msg.ok{color:#2B8A3E}.msg.no{color:var(--red)}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.twocol{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px}
@media (max-width:700px){.twocol{grid-template-columns:1fr}.welcome-top-row{grid-template-columns:1fr auto}.welcome-top-row .welcome-text{grid-column:1;justify-self:start;text-align:left}.welcome-top-row .logout-btn{grid-column:2}.bigtext{font-size:34px}}
.slots{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 6px}
.slot{width:62px;height:76px;border-radius:14px;border:4px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:42px;font-weight:600;position:relative}
.slot .guide{color:#C9C3AE;position:absolute}
.slot.good{background:#D3F9D8;border-color:#2B8A3E}.slot.bad{background:#FFE3E3;border-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.tile{min-width:70px;min-height:70px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-family:'Fredoka',sans-serif;font-size:36px;font-weight:600;box-shadow:0 5px 0 var(--blue-d);cursor:pointer;padding:0 14px}
.tile.used{background:#E9E2D0;color:#8A8470;box-shadow:none;cursor:default}
.tile.small{font-size:26px;min-height:60px}
.sline{min-height:90px;background:#fff;border:4px dashed var(--ink);border-radius:20px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tok{min-height:56px;border-radius:14px;border:0;background:var(--yellow);font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600;padding:0 16px;cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (min-width:760px){.mem.n16{grid-template-columns:repeat(8,minmax(0,1fr))}.mem.n12{grid-template-columns:repeat(6,minmax(0,1fr))}}
.mcard{aspect-ratio:1/1;border-radius:16px;border:4px solid var(--ink);background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;color:#fff;overflow:hidden}
.mcard.up{background:#fff;color:var(--ink)}
.mcard.done{background:#D3F9D8;border-color:#2B8A3E}
.mcard img{max-width:100%;max-height:100%;object-fit:contain}
.mcard .numtile{font-size:48px}
.meanings{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.mean{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:800}
.mean.on{background:var(--yellow)}

/* ---------- result / student ---------- */
.result{max-width:560px;margin:10px auto;text-align:center}
.stars{font-size:56px;letter-spacing:6px;color:#F59F00;line-height:1}
.stars .off{color:#E0D8C2}
.big{font-family:'Fredoka',sans-serif;font-size:56px;font-weight:600;line-height:1}
.practice-chip{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:800;background:#FFE3E3;margin:3px}
table{border-collapse:collapse;width:100%}
.tbl-wrap{overflow-x:auto;background:#fff;border:3px solid var(--ink);border-radius:18px}
th,td{padding:8px 10px;text-align:center;font-size:15px;border-top:2px solid #EFE8D6;white-space:nowrap}
th{background:var(--ink);color:#fff;border-top:0}
td:first-child,th:first-child{text-align:left}
.tpb{display:inline-block;min-width:54px;border-radius:10px;padding:2px 8px;font-weight:800;line-height:1.2}
.tp1,.tp2{background:#FFC9C9}.tp3{background:#FFEC99}.tp4{background:#D8F5A2}.tp5,.tp6{background:#B2F2BB}.tp0{background:#EEE8D4;color:var(--muted)}
.tpb small{display:block;font-weight:700;font-size:12px}
.teacher-header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.teacher-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sumcard{background:#fff;border:2px solid #D9DBEA;border-radius:14px;padding:8px 14px}
.sumcard b{display:block;font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600}
.sumcard span{font-weight:800;font-size:13px;color:var(--muted)}
.sec{margin:18px 0 8px;font-size:22px}
.gap-item{background:#FFF4E0;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-weight:700;font-size:15px}
.tpguide details{background:#fff;border:2px solid #D9DBEA;border-radius:12px;padding:8px 14px;margin-bottom:8px}
.tpguide summary{font-weight:800;cursor:pointer;min-height:32px}
.tpguide li{margin-bottom:6px;font-size:14px}
.note{font-weight:700;font-size:14px;color:var(--muted)}
textarea.cm{width:260px;min-height:56px;border:2px solid #C9CBE0;border-radius:10px;padding:6px 8px;font-size:14px;white-space:normal}
.toast-message{position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:14px 22px;border-radius:14px;font-weight:800;z-index:10001;box-shadow:0 8px 16px rgba(0,0,0,.25);animation:slideInRight .3s ease}
.toast-message.error{background:var(--red)}
@keyframes slideInRight{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---------- Write it ---------- */
.wi-lab{display:inline-block;background:#E5DBFF;border-radius:12px;padding:8px 14px;font-weight:800;font-size:22px}
.wi-chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.wi-chip{background:#FFD43B;border-radius:14px;padding:8px 16px;font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600}
.wi-dash{font-size:28px;font-weight:800}
.wi-one{max-height:150px}
.wi-mark{position:absolute;right:14px;top:8px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff}
.wi-mark.yes{background:#2F9E44}.wi-mark.no{background:#C92A2A}
.scene{width:100%;display:flex;justify-content:center}
.scene-real{max-width:100%;max-height:200px;object-fit:contain}
.sc{position:relative;width:100%;max-width:300px;height:200px}
.sc img{max-width:100%;max-height:100%;object-fit:contain}
.sc .sc-a,.sc .sc-b{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center}
.sc-on .sc-b{bottom:0;width:70%;height:98px}
.sc-on .sc-a{bottom:96px;width:44%;height:84px}
.sc-in .sc-b{bottom:0;width:78%;height:150px}
.sc-in .sc-a{bottom:30px;width:34%;height:66px;z-index:2}
.sc-under .sc-b{top:0;width:70%;height:100px;z-index:2}
.sc-under .sc-a{bottom:0;width:44%;height:90px;z-index:1}
.cmp{font-size:24px;font-weight:800;margin:6px 0;word-wrap:break-word}
.cmp small{display:block;font-size:14px;color:#4A4A6A;font-weight:800}
.bad{background:#FFE3E3;color:#C92A2A;border-radius:6px;padding:0 4px}
.good{color:#2B8A3E}
.fixh{font-size:22px;margin:10px 0 0}
ul.fix{margin:6px 0 0;padding-left:22px}
ul.fix li{font-size:20px;font-weight:800;margin:6px 0}
.ok{font-family:'Fredoka',sans-serif;font-size:28px;color:#2B8A3E;margin-top:6px}
.star{font-size:20px;font-weight:800;background:#FFF3BF;border-radius:12px;padding:8px 12px;margin-top:8px}
.note2{font-size:16px;font-weight:700;color:#4A4A6A;margin-top:8px}
#wiRes{margin-top:8px}

/* ---------- leaderboards ---------- */
.lb-toggle{display:flex;gap:8px;flex-wrap:wrap}
.lb-toggle .skill-btn{min-height:48px;font-size:16px;padding:0 16px}
.unit-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.unit-chip{min-height:44px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:15px;padding:0 14px;cursor:pointer}
.unit-chip.on{background:var(--yellow)}
table.lb{margin-top:8px}
table.lb td,table.lb th{text-align:left}
table.lb th:nth-child(3),table.lb td:nth-child(3),table.lb th:nth-child(4),table.lb td:nth-child(4){text-align:center}
table.lb tr.me td{background:#FFF3BF;font-weight:800}
</style>
</head>
<body>

<div class="login-container" id="loginPage">
 <div class="login-box">
  <div class="login-logo"><svg width="46" height="46" viewBox="0 0 24 24" fill="#FFD43B" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9.5 9,9"/></svg></div>
  <div class="login-title">Year 1 English Practice</div>
  <p class="credential-line">Edu Apps | Learn with Ms Tan &nbsp;&middot;&nbsp; &copy; TYP</p>
  <div class="resume-banner hidden" id="resumeBanner">
   <p class="resume-text">Welcome back, <span id="resumeName"></span>! Keep playing?</p>
   <button type="button" class="login-btn" id="resumeBtn" style="font-size:22px;min-height:52px">Yes, keep playing</button>
   <button type="button" class="resume-fresh-btn" id="startFreshBtn">No, start new</button>
  </div>
  <div class="login-subtitle">Play games. Learn English. Win stars!</div>
  <form id="loginForm">
   <div class="form-group"><label for="studentName" class="form-label">My name</label>
    <input type="text" id="studentName" class="form-input" placeholder="Type your name" autocomplete="off" required></div>
   <div class="form-group"><label for="studentClass" class="form-label">My class</label>
    <input type="text" id="studentClass" class="form-input" placeholder="Example: 1Z" autocomplete="off" required></div>
   <button type="submit" class="login-btn" id="loginButton">Let's go!</button>
  </form>
 </div>
</div>

<div class="app-container hidden" id="mainApp">
 <div class="welcome-message">
  <div class="welcome-top-row">
   <p class="welcome-text">Welcome, <span id="welcomeName"></span>! <span id="welcomeClass"></span></p>
   <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  <div class="welcome-actions">
   <button class="header-btn" id="homeBtn">Play</button>
   <button class="header-btn" id="studentViewBtn">My Result</button>
   <button class="header-btn" id="teacherViewBtn">Teacher View</button>
  </div>
 </div>
 <div id="stage"></div>
</div>

<script src="data.js"></script>
<script src="check.js"></script>
<script src="recognize.js"></script>
<script src="writepad.js"></script>
<script src="app.js"></script>
</body>
</html>
